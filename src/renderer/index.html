<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neutron Star Editor</title>
  <!-- 使用本地 Font Awesome -->
  <link rel="stylesheet" href="../../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
  <style>
    :root {
      --sidebar-bg: #1e1e1e;
      --editor-bg: #1a1a1a;
      --tab-bg: #252526;
      --tab-active-bg: #1a1a1a;
      --text-primary: #e0e0e0;
      --text-secondary: #9d9d9d;
      --border-color: #383838;
      --accent-color: #4ec9b0;
      --hover-color: #2d2d2d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--editor-bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 顶部标题栏 */
    .title-bar {
      height: 24px;
      background-color: var(--sidebar-bg);
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 12px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    /* 标题栏内的交互元素应可点击：禁止被拖拽区域覆盖 */
    .title-bar * {
      -webkit-app-region: no-drag;
    }

    /* 标签栏 */
    .tabs-container {
      height: 36px;
      background-color: var(--tab-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .tab {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 100%;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      position: relative;
    }

    .tab.active {
      background-color: var(--tab-active-bg);
      color: var(--accent-color);
    }

    .tab:not(.active):hover {
      background-color: var(--hover-color);
    }

    .tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--accent-color);
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    .tab.active::after {
      transform: scaleX(1);
    }

    .tab-close {
      margin-left: 8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      opacity: 0.7;
    }

    .tab-close:hover {
      background-color: rgba(255, 255, 255, 0.1);
      opacity: 1;
    }

    /* 主内容区 */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* 侧边栏 */
    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
      position: absolute;
      height: calc(100% - 61px);
      z-index: 10;
    }

    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h3 {
      font-size: 13px;
      font-weight: 500;
    }

    .sidebar-controls {
      display: flex;
      gap: 5px;
    }

    .sidebar-control-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-control-btn:hover {
      background-color: var(--hover-color);
      color: var(--text-primary);
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 5px 0;
    }

    .tree-item {
      padding: 4px 10px;
      padding-left: 20px;
      display: flex;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }

    .tree-item:hover {
      background-color: var(--hover-color);
    }

    .tree-item-icon {
      margin-right: 8px;
      font-size: 16px;
    }

    /* 编辑器区域 */
    .editor-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #editor {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .editor-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .editor-placeholder h2 {
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: 300;
    }

    .editor-placeholder p {
      font-size: 14px;
      opacity: 0.7;
    }

    /* 底部状态栏 */
    .status-bar {
      height: 21px;
      background-color: var(--sidebar-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-bar-section {
      display: flex;
      gap: 15px;
    }

    .status-bar-item {
      padding: 0 5px;
      cursor: pointer;
    }

    .status-bar-item:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <!-- 标题栏 -->
  <div class="title-bar">
    <span id="app-title">Neutron Star Editor</span>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <select id="lang-select" title="Language">
        <option value="zh-cn">中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <!-- 标签栏 -->
  <div class="tabs-container"></div>

  <!-- 主内容区 -->
  <div class="main-container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Project</h3>
        <div class="sidebar-controls">
          <button class="sidebar-control-btn" id="sidebar-toggle-btn">⟳</button>
          <button class="sidebar-control-btn" id="sidebar-close-btn">×</button>
        </div>
      </div>
      <div class="file-tree" id="file-tree"></div>
    </div>

    <!-- 编辑器区域 -->
    <div class="editor-container">
      <div class="editor-placeholder">
        <h2>Neutron Star Editor</h2>
        <p>Open a file or folder to get started</p>
      </div>
      <div id="editor"></div>
    </div>
  </div>


  <script type="module">
    (async () => {
      try {
        // Load lightweight commands bridge first so menu actions work
        await import('./commands.js');
      } catch (e) {
        console.error('Failed to load commands bridge', e);
      }

      try {
        await import('./index.js');
      } catch (e) {
        // Log loader error to console but do not show intrusive red bar in the UI
        console.error('Failed to load renderer module', e);
        // Optionally show a non-intrusive console-only notice; UI red bar removed per user request
      }
    })();
  </script>
  <!-- Debug overlay: 仅开发环境显示 -->
  <script>
    if (window.process && window.process.env && window.process.env.NODE_ENV === 'development') {
      (function(){
        const box = document.createElement('div');
        box.id = 'debug-overlay';
        box.style.position = 'fixed';
        box.style.right = '10px';
        box.style.bottom = '10px';
        box.style.background = 'rgba(0,0,0,0.7)';
        box.style.color = 'white';
        box.style.padding = '8px 10px';
        box.style.fontSize = '12px';
        box.style.zIndex = '10000';
        box.style.pointerEvents = 'none';
        box.style.maxWidth = '320px';
        box.style.whiteSpace = 'nowrap';
        box.textContent = 'debug overlay';
        document.body.appendChild(box);

        function describeEl(el){
          if(!el) return 'null';
          const id = el.id?('#'+el.id):'';
          const cls = el.className?('.'+String(el.className).split(' ').join('.')):'';
          const tag = el.tagName;
          const style = window.getComputedStyle(el);
          const zi = style.zIndex || 'auto';
          const pe = style.pointerEvents || 'auto';
          return `${tag}${id}${cls} z-index:${zi} pointer-events:${pe}`;
        }

        document.addEventListener('mousemove', (ev)=>{
          const el = document.elementFromPoint(ev.clientX, ev.clientY);
          box.textContent = `Hover: ${describeEl(el)}`;
        }, {capture:true, passive:true});

        document.addEventListener('click', (ev)=>{
          const el = ev.target;
          const info = `CLICK target: ${describeEl(el)} button:${ev.button} client:${ev.clientX},${ev.clientY}`;
          console.log(info, ev);
          // append to box briefly
          const prev = box.textContent;
          box.textContent = info;
          setTimeout(()=>{ box.textContent = prev; }, 3000);
        }, true);
      })();
    }
  </script>
</body>
</html>
